<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A.S.T. Admin Console</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <meta name="theme-color" content="#0a0a0a">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
    
    <style>
        /* Ajuste Pestañas */
        .nav-pills .nav-link { color: #aaa; border: 1px solid #333; margin-right: 5px; white-space: nowrap; }
        .nav-pills .nav-link.active { background-color: var(--ast-cyan); color: #000; font-weight: bold; }
        
        /* Ocultar barra de scroll en movil */
        .scroll-hide::-webkit-scrollbar { display: none; }
        .scroll-hide { -ms-overflow-style: none; scrollbar-width: none; }

        .hidden-section { display: none !important; }
        /* Botón instalar */
        #btn-install { display: none; }
        
        /* Estilos Proyectos y Historial */
        .project-card, .history-card {
            border-left: 4px solid var(--ast-cyan);
            background: #1a1a1a;
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 4px;
        }
        .text-profit { color: #00ff88; }
        .text-loss { color: #ff4d4d; }

        /* Dashboard Cards */
        .kpi-card {
            background: #141414;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
        }
        .kpi-value { font-size: 1.1rem; font-weight: bold; color: white; }
        .kpi-label { font-size: 0.7rem; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand sticky-top px-3 border-bottom border-cyan">
        <a class="navbar-brand fw-bold text-white" href="#">
            <img src="icon.png" width="30" height="30" class="d-inline-block align-top rounded me-2" alt="">
            A.S.T. <span class="text-cyan">SYSTEMS</span>
        </a>
        
        <button id="btn-install" class="btn btn-sm btn-outline-light ms-2 fw-bold" onclick="installApp()">
            <i class="bi bi-download"></i> INSTALAR APP
        </button>

        <div class="ms-auto d-flex gap-2 align-items-center">
            <div id="connection-status" class="status-dot bg-secondary" title="Estado de Conexión"></div>
            <button id="btn-main-add" class="btn btn-sm btn-outline-cyan" onclick="openProductModal()">
                <i class="bi bi-plus-lg"></i>
            </button>
        </div>
    </nav>

    <div class="container-fluid py-4">
        
        <div class="row mb-3">
            <div class="col-12 overflow-auto scroll-hide">
                <ul class="nav nav-pills flex-nowrap pb-1">
                    <li class="nav-item">
                        <button class="nav-link active" id="tab-prod" onclick="switchTab('PRODUCTO')">PRODUCTOS</button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link" id="tab-serv" onclick="switchTab('SERVICIO')">SERVICIOS</button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link" id="tab-proj" onclick="switchTab('PROYECTOS')">PROYECTOS</button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link" id="tab-hist" onclick="switchTab('HISTORIAL')">HISTORIAL</button>
                    </li>
                </ul>
            </div>
        </div>

        <div id="view-catalog">
            <div class="row justify-content-center mb-4">
                <div class="col-12 col-md-6">
                    <div class="input-group input-group-sm border-cyan-glow">
                        <span class="input-group-text bg-dark border-secondary text-cyan"><i class="bi bi-search"></i></span>
                        <input type="text" id="search" class="form-control bg-dark text-white border-secondary" placeholder="Buscar...">
                    </div>
                </div>
            </div>

            <div id="catalog-grid" class="row g-3">
                <div class="col-12 text-center mt-5">
                    <div class="spinner-border text-cyan" role="status"></div>
                    <p class="text-muted mt-2">Cargando Sistema...</p>
                </div>
            </div>
        </div>

        <div id="view-projects" class="hidden-section">
            
            <div id="projects-dashboard" class="row g-2 mb-3 d-none">
                <div class="col-4">
                    <div class="kpi-card">
                        <div class="kpi-label">Facturado</div>
                        <div class="kpi-value text-cyan" id="kpi-cobrado">$0</div>
                    </div>
                </div>
                <div class="col-4">
                    <div class="kpi-card">
                        <div class="kpi-label">Gastos</div>
                        <div class="kpi-value text-danger" id="kpi-gastos">$0</div>
                    </div>
                </div>
                <div class="col-4">
                    <div class="kpi-card">
                        <div class="kpi-label">Utilidad</div>
                        <div class="kpi-value text-profit" id="kpi-utilidad">$0</div>
                    </div>
                </div>
                <div class="col-12 text-center mt-1">
                    <small class="text-muted" style="font-size: 0.7rem;">MARGEN GLOBAL: <span id="kpi-margen" class="fw-bold text-white">0%</span></small>
                </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="text-white m-0">Trabajos Activos</h5>
                <button class="btn btn-sm btn-cyan" onclick="openNewProjectModal()">
                    <i class="bi bi-folder-plus"></i> NUEVO
                </button>
            </div>
            <div id="projects-list"></div>
        </div>

        <div id="view-history" class="hidden-section">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="text-white m-0">Historial Documentos</h5>
                <button class="btn btn-sm btn-outline-secondary" onclick="fetchHistory()">
                    <i class="bi bi-arrow-clockwise"></i>
                </button>
            </div>
            <div id="history-list"></div>
        </div>

    </div>

    <div class="fab-cart" id="fab-cart" onclick="openCart()">
        <i class="bi bi-file-earmark-pdf-fill"></i>
        <span class="fab-badge" id="cart-count">0</span>
    </div>

    <datalist id="clients-datalist"></datalist>

    <div class="modal fade" id="prodModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content bg-dark-panel border-cyan">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title text-cyan" id="modal-title">Gestión</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="prodForm">
                        <input type="hidden" id="p-uuid">
                        
                        <div class="mb-3">
                            <label class="small text-secondary fw-bold">¿Qué deseas crear?</label>
                            <select id="p-tipo" class="form-select bg-dark text-white border-cyan" onchange="toggleFormFields()">
                                <option value="PRODUCTO">PRODUCTO FÍSICO</option>
                                <option value="SERVICIO">SERVICIO / MANO DE OBRA</option>
                            </select>
                        </div>

                        <div class="mb-3">
                             <label class="small text-secondary">Imagen (Web / App)</label>
                             <div class="input-group">
                                 <input type="file" id="p-imagen-file" class="form-control form-control-sm bg-dark text-white border-secondary" accept="image/*">
                                 <button class="btn btn-outline-secondary" type="button" onclick="document.getElementById('p-imagen-file').value = ''"><i class="bi bi-x"></i></button>
                             </div>
                             <input type="hidden" id="p-imagen-data"> 
                        </div>

                        <div id="fields-producto">
                            <div class="mb-2">
                                <label class="small text-cyan fw-bold">Categoría</label>
                                <select id="p-categoria" class="form-select form-select-sm bg-dark text-white border-secondary">
                                    <option value="AUTOMATIZACION_APPS">Automatización y Apps</option>
                                    <option value="DOMOTICA_HOGAR">Domótica y Hogar</option>
                                    <option value="ELECTRICIDAD_RESIDENCIAL">Electricidad Residencial</option>
                                    <option value="MANTENIMIENTO_INDUSTRIAL">Mantenimiento Industrial</option>
                                </select>
                            </div>

                            <div class="mb-2">
                                <label class="small text-secondary">Código</label>
                                <input type="text" id="p-codigo" class="form-control form-control-sm bg-dark text-secondary border-secondary" placeholder="Autogenerado" readonly>
                            </div>

                            <div class="mb-2">
                                <label class="small text-danger">Costo Interno (Privado)</label>
                                <input type="number" id="p-costo" class="form-control form-control-sm bg-dark text-white border-danger">
                            </div>
                        </div>

                        <div class="mb-2">
                            <label class="small text-secondary">Nombre del Ítem</label>
                            <input type="text" id="p-nombre" class="form-control bg-dark text-white border-secondary" required>
                        </div>
                        <div class="mb-2">
                            <label class="small text-secondary">Descripción / Detalles</label>
                            <textarea id="p-specs" class="form-control form-control-sm bg-dark text-white border-secondary" rows="3"></textarea>
                        </div>
                        <div class="mb-2">
                            <label class="small text-cyan fw-bold">Precio Público (Venta)</label>
                            <input type="number" id="p-precio" class="form-control form-control-sm bg-dark text-white border-cyan">
                        </div>
                        
                        <div class="form-check form-switch mt-2">
                            <input class="form-check-input" type="checkbox" id="p-web">
                            <label class="form-check-label small" for="p-web">Visible en Web Pública</label>
                        </div>

                    </form>
                </div>
                <div class="modal-footer border-secondary">
                    <button type="button" class="btn btn-cyan w-100" onclick="saveProduct()">GUARDAR DATOS</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="cartModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content bg-dark-panel border-cyan">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title text-cyan">Resumen del Pedido</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    
                    <div class="input-group input-group-sm mb-3">
                        <select id="cart-import-project" class="form-select bg-dark text-white border-secondary">
                            <option value="">-- Importar ítems de un Proyecto --</option>
                        </select>
                        <button class="btn btn-outline-cyan" onclick="importFromProject()">Importar</button>
                    </div>

                    <div id="cart-items" class="mb-3"></div>
                    
                    <div class="d-flex justify-content-between mb-3">
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="check-specs" checked>
                            <label class="form-check-label text-white small" for="check-specs">Mostrar Descripción en PDF</label>
                        </div>

                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="check-iva" onchange="updateCartUI()">
                            <label class="form-check-label text-white small fw-bold" for="check-iva">Cobrar IVA (19%)</label>
                        </div>
                    </div>

                    <div class="p-3 mb-3 border border-secondary rounded bg-dark">
                        <h6 class="text-white mb-2">Datos del Cliente</h6>
                        <div class="row g-2">
                            <div class="col-md-6">
                                <input type="text" id="c-nombre" class="form-control form-control-sm bg-dark text-white border-secondary" list="clients-datalist" placeholder="Nombre / Razón Social" onchange="autoFillClient(this.value, 'c')">
                            </div>
                            <div class="col-md-3"><input type="text" id="c-nit" class="form-control form-control-sm bg-dark text-white border-secondary" placeholder="NIT"></div>
                            <div class="col-md-3"><input type="text" id="c-tel" class="form-control form-control-sm bg-dark text-white border-secondary" placeholder="Teléfono"></div>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <select id="doc-type" class="form-select form-select-sm bg-dark text-white border-secondary w-50">
                            <option value="Cotización">Cotización</option>
                            <option value="Cuenta de Cobro">Cuenta de Cobro</option>
                        </select>
                        <div class="text-end">
                            <small class="text-muted d-block" id="iva-display">IVA: $0</small>
                            <h4 class="text-cyan m-0" id="cart-total">$0</h4>
                        </div>
                    </div>
                </div>
                
                <div class="modal-footer border-secondary">
                    <div class="row w-100">
                        <div class="col-6">
                            <button type="button" class="btn btn-outline-success w-100 fw-bold" onclick="sendWhatsApp()">
                                <i class="bi bi-whatsapp"></i> WhatsApp
                            </button>
                        </div>
                        <div class="col-6">
                            <button type="button" class="btn btn-success w-100 fw-bold" onclick="generatePDF()">
                                <i class="bi bi-file-earmark-pdf"></i> Generar PDF
                            </button>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <div class="modal fade" id="newProjectModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content bg-dark-panel border-cyan">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title text-white">Nuevo Trabajo</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="text-cyan small fw-bold">Nombre del Trabajo / Proyecto</label>
                        <input type="text" id="np-proyecto" class="form-control bg-dark text-white border-cyan" placeholder="Ej: Instalación 4 Cámaras">
                    </div>
                    <div class="mb-3">
                        <label class="text-muted small">Cliente / Empresa</label>
                        <input type="text" id="np-cliente" class="form-control bg-dark text-white border-secondary" list="clients-datalist" placeholder="Buscar Cliente..." onchange="autoFillClient(this.value, 'np')">
                    </div>
                    <div class="mb-3">
                        <label class="text-muted small">Contacto</label>
                        <input type="text" id="np-contacto" class="form-control bg-dark text-white border-secondary" placeholder="Teléfono o Email">
                    </div>
                </div>
                <div class="modal-footer border-secondary">
                    <button class="btn btn-cyan w-100" onclick="createNewProject()">CREAR CARPETA</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="editProjectModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content bg-dark-panel border-cyan">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title text-white">Editar Trabajo</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="ep-id">
                    <div class="mb-3">
                        <label class="text-cyan small fw-bold">Nombre del Trabajo</label>
                        <input type="text" id="ep-proyecto" class="form-control bg-dark text-white border-cyan">
                    </div>
                    <div class="mb-3">
                        <label class="text-muted small">Cliente</label>
                        <input type="text" id="ep-cliente" class="form-control bg-dark text-white border-secondary" list="clients-datalist">
                    </div>
                    <div class="mb-3">
                        <label class="text-muted small">Contacto</label>
                        <input type="text" id="ep-contacto" class="form-control bg-dark text-white border-secondary">
                    </div>
                    <div class="mb-3">
                        <label class="text-muted small">Estado</label>
                        <select id="ep-estado" class="form-select bg-dark text-white border-secondary">
                            <option value="ABIERTO">ABIERTO</option>
                            <option value="CERRADO">CERRADO / FINALIZADO</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer border-secondary">
                    <button class="btn btn-cyan w-100" onclick="updateProject()">GUARDAR CAMBIOS</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="projectDetailModal" tabindex="-1">
        <div class="modal-dialog modal-fullscreen">
            <div class="modal-content bg-dark-panel">
                <div class="modal-header border-bottom border-secondary">
                    <div class="flex-grow-1 me-2 overflow-hidden">
                        <h5 class="modal-title text-cyan text-truncate" id="pd-title">...</h5>
                        <small class="text-muted text-truncate d-block" id="pd-subtitle">...</small>
                    </div>
                    <div class="d-flex gap-2">
                        <button class="btn btn-sm btn-outline-secondary" onclick="openEditProjectModal()">
                            <i class="bi bi-pencil-fill"></i>
                        </button>
                        <button class="btn btn-sm btn-outline-danger" onclick="deleteProject()">
                            <i class="bi bi-trash-fill"></i>
                        </button>
                        <button type="button" class="btn-close btn-close-white ms-2" data-bs-dismiss="modal"></button>
                    </div>
                </div>
                <div class="modal-body p-0">
                    <div class="row g-0 border-bottom border-secondary text-center">
                        <div class="col-4 p-2 border-end border-secondary">
                            <small class="text-muted d-block">COBRADO</small>
                            <span class="text-white fw-bold" id="pd-cobrado">$0</span>
                        </div>
                        <div class="col-4 p-2 border-end border-secondary">
                            <small class="text-muted d-block">GASTOS</small>
                            <span class="text-danger fw-bold" id="pd-gastos">$0</span>
                        </div>
                        <div class="col-4 p-2">
                            <small class="text-muted d-block">UTILIDAD</small>
                            <span class="text-success fw-bold" id="pd-utilidad">$0</span>
                        </div>
                    </div>

                    <div class="p-3" id="pd-items-list">
                        </div>
                </div>
                <div class="modal-footer border-top border-secondary bg-dark">
                    <button class="btn btn-outline-light flex-grow-1" onclick="openAddItemModal()">
                        <i class="bi bi-tools"></i> Agregar Ítem/Gasto
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="addItemModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-dark-panel border-secondary">
                <div class="modal-header border-secondary py-2">
                    <h6 class="modal-title text-white">Registrar Movimiento</h6>
                    <button type="button" class="btn-close btn-close-white small" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="ai-id">

                    <div class="mb-3 border-bottom border-secondary pb-3">
                        <label class="small text-cyan fw-bold">Importar del Catálogo</label>
                        <div class="input-group input-group-sm">
                            <input class="form-control bg-dark text-white border-cyan" list="list-catalog-items" id="ai-search" onchange="fillItemFromCatalog(this.value)" placeholder="Escribe para buscar...">
                            <button class="btn btn-outline-secondary" onclick="document.getElementById('ai-search').value=''"><i class="bi bi-x"></i></button>
                        </div>
                        <datalist id="list-catalog-items"></datalist>
                    </div>

                    <div class="mb-2">
                        <label class="small text-muted">Descripción</label>
                        <input type="text" id="ai-desc" class="form-control form-control-sm bg-dark text-white border-secondary">
                    </div>
                    <div class="row g-2 mb-2">
                        <div class="col-6">
                            <label class="small text-muted">Tipo</label>
                            <select id="ai-tipo" class="form-select form-select-sm bg-dark text-white border-secondary">
                                <option value="MATERIAL">Material / Insumo</option>
                                <option value="MANO_OBRA">Mano de Obra</option>
                                <option value="TRANSPORTE">Transporte / Viáticos</option>
                                <option value="OTRO">Otro</option>
                            </select>
                        </div>
                        <div class="col-6">
                            <label class="small text-muted">Proveedor (Opcional)</label>
                            <input type="text" id="ai-prov" class="form-control form-control-sm bg-dark text-white border-secondary" placeholder="Lugar de compra">
                        </div>
                    </div>
                    <div class="row g-2 mb-2">
                        <div class="col-4">
                            <label class="small text-muted">Cant.</label>
                            <input type="number" id="ai-cant" class="form-control form-control-sm bg-dark text-white border-secondary" value="1">
                        </div>
                        <div class="col-8">
                            <label class="small text-danger">COSTO UNIT (Lo que pagas)</label>
                            <input type="number" id="ai-costo" class="form-control form-control-sm bg-dark text-white border-danger" value="0">
                        </div>
                    </div>
                    
                    <hr class="border-secondary my-2">

                    <div class="form-check form-switch mb-2">
                        <input class="form-check-input" type="checkbox" id="ai-cobrar" checked onchange="toggleVentaInput()">
                        <label class="form-check-label text-cyan small fw-bold" for="ai-cobrar">¿COBRAR AL CLIENTE?</label>
                    </div>

                    <div class="mb-2" id="div-venta">
                        <label class="small text-cyan">PRECIO VENTA UNIT (Lo que cobras)</label>
                        <input type="number" id="ai-venta" class="form-control form-control-sm bg-dark text-white border-cyan" value="0">
                    </div>
                </div>
                <div class="modal-footer border-secondary py-2">
                    <button class="btn btn-primary w-100 btn-sm" onclick="saveProjectItem()">REGISTRAR</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
