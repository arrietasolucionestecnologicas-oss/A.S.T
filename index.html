<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Software Contable Arrieta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-primary sticky-top shadow-sm">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">
                <i class="bi bi-cpu-fill"></i> Arrieta ERP
            </span>
            <button class="btn btn-light position-relative" onclick="openCart()">
                <i class="bi bi-cart-fill text-primary"></i>
                <span id="cart-count" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
                    0
                </span>
            </button>
        </div>
    </nav>

    <div class="container py-4">
        
        <div class="input-group mb-2">
            <span class="input-group-text bg-white border-end-0"><i class="bi bi-search"></i></span>
            <input type="text" id="search-input" class="form-control border-start-0" placeholder="Buscar producto o servicio...">
        </div>

        <div class="d-flex justify-content-end mb-4">
            <button class="btn btn-outline-success btn-sm fw-bold" onclick="openManualItemModal()">
                <i class="bi bi-plus-circle"></i> Nuevo Producto/Servicio Manual
            </button>
        </div>

        <div id="product-grid" class="row g-3">
            <div class="col-12 text-center py-5">
                <div class="spinner-border text-primary" role="status"></div>
                <p>Cargando catálogo...</p>
            </div>
        </div>
    </div>

    <div class="modal fade" id="cartModal" tabindex="-1">
        <div class="modal-dialog modal-fullscreen-sm-down">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title">Resumen de Orden</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="cart-items" class="mb-3"></div>
                    
                    <div class="card bg-light mb-3">
                        <div class="card-body">
                            <div class="d-flex justify-content-between">
                                <span>Subtotal:</span>
                                <span id="cart-subtotal">$0</span>
                            </div>
                            <div class="d-flex justify-content-between align-items-center mt-2">
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" id="tax-toggle" onchange="renderCart()">
                                    <label class="form-check-label small" for="tax-toggle">Incluir IVA (19%)</label>
                                </div>
                                <span id="cart-tax">$0</span>
                            </div>
                            <hr>
                            <div class="d-flex justify-content-between fw-bold fs-5 text-primary">
                                <span>Total:</span>
                                <span id="cart-total">$0</span>
                            </div>
                        </div>
                    </div>

                    <div class="mb-3 bg-white p-2 border rounded shadow-sm">
                        <label class="form-label small fw-bold text-primary">¿Qué documento generamos?</label>
                        <select class="form-select form-select-sm" id="doc-type">
                            <option value="Cotización">Cotización (Oferta Comercial)</option>
                            <option value="Cuenta de Cobro">Cuenta de Cobro (Servicio Prestado)</option>
                        </select>
                    </div>

                    <h6 class="border-bottom pb-2 mb-3">Datos del Cliente</h6>
                    <form id="checkout-form">
                        <div class="mb-2">
                            <label class="form-label small">Cliente / Razón Social</label>
                            <input type="text" class="form-control" id="client-name" required placeholder="Ej: Juan Pérez">
                        </div>
                        <div class="row g-2 mb-2">
                            <div class="col-6">
                                <label class="form-label small">NIT / CC</label>
                                <input type="text" class="form-control" id="client-nit" placeholder="Opcional">
                            </div>
                            <div class="col-6">
                                <label class="form-label small">Teléfono</label>
                                <input type="tel" class="form-control" id="client-phone" placeholder="300...">
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer d-flex flex-column gap-2">
                    <button type="button" class="btn btn-secondary w-100 py-2 fw-bold" onclick="processOrder('save')">
                        <i class="bi bi-file-earmark-pdf"></i> Solo Generar PDF
                    </button>
                    <button type="button" class="btn btn-success w-100 py-2 fw-bold" onclick="processOrder('whatsapp')">
                        <i class="bi bi-whatsapp"></i> Generar y Enviar WhatsApp
                    </button>
                    
                    <div id="loading-msg" class="text-center small text-muted mt-2 d-none">
                        <div class="spinner-border spinner-border-sm text-primary" role="status"></div>
                        Generando PDF oficial, por favor espera...
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="manualItemModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title fs-6">Agregar Servicio/Producto Nuevo</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p class="small text-muted mb-2"><i class="bi bi-info-circle"></i> Este ítem se guardará en tu catálogo automáticamente para el futuro.</p>
                    <div class="mb-2">
                        <label class="small fw-bold">Nombre del Servicio/Producto</label>
                        <input type="text" id="manual-name" class="form-control" placeholder="Ej: Streaming Evento X">
                    </div>
                    <div class="mb-2">
                        <label class="small fw-bold">Descripción / Detalles</label>
                        <textarea id="manual-specs" class="form-control" rows="2" placeholder="Detalles técnicos..."></textarea>
                    </div>
                    <div class="mb-2">
                        <label class="small fw-bold">Precio Unitario</label>
                        <input type="number" id="manual-price" class="form-control" placeholder="0">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-success btn-sm" onclick="addManualItem()">Agregar al Carrito</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
